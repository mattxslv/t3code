name: Personal sync

# Merges each new official T3 Code release into personal/release, then builds it.
# Conflicts or failed checks are handed to Claude Code (CLAUDE_CODE_OAUTH_TOKEN, a one-year token
# from `claude setup-token`). A fix ships only when no conflict markers remain and every typecheck
# passes. When Claude is out of usage, the next run (about five hours later) tries again, and the
# run alerts after 48 hours. An expired token, a missing token or a fix Claude could not finish
# alerts at once, and Claude is not called again for that release unless the workflow is run by hand.
# Each release alerts once: the run fails, later runs only warn.
on:
  schedule:
    - cron: "41 */5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: personal-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.push.outputs.merged }}
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal/release
          fetch-depth: 0
      # Claude runs in this checkout; the push step authenticates on its own. (persist-credentials:
      # false trips over a stale upstream submodule entry, so the credential is removed here.)
      - name: Drop checkout credentials
        run: git config --local --unset-all http.https://github.com/.extraheader || true
      - name: Merge latest official release
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh release view --repo pingdotgg/t3code --json tagName -q .tagName)
          git fetch --quiet --no-tags https://github.com/pingdotgg/t3code.git "refs/tags/$latest:refs/tags/$latest"
          if git merge-base --is-ancestor "$latest" HEAD; then
            echo "Already on $latest."
            exit 0
          fi
          echo "latest=$latest" >>"$GITHUB_ENV"
          git config user.name "mattxslv"
          git config user.email "79420609+mattxslv@users.noreply.github.com"
          git merge --no-commit --no-ff "$latest" || true
          # Inherited upstream workflows stay disabled here, and the job token may not push workflow changes.
          git restore --source=HEAD --staged --worktree -- .github/workflows
          git diff --name-only --diff-filter=U >"$RUNNER_TEMP/conflicted.txt"
          if [ -s "$RUNNER_TEMP/conflicted.txt" ]; then
            echo "fix_reason=conflicts" >>"$GITHUB_ENV"
            exit 0
          fi
          git commit --no-edit --quiet
          echo "merged_locally=true" >>"$GITHUB_ENV"
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        if: env.latest != ''
        with:
          node-version-file: package.json
      - name: Prepare checks
        if: env.latest != ''
        run: |
          # Fails while conflict markers remain or any typecheck fails; the log feeds Claude and the report.
          cat >"$RUNNER_TEMP/verify.sh" <<'EOF'
          #!/usr/bin/env bash
          set -uo pipefail
          log="$RUNNER_TEMP/check.log"
          : >"$log"
          git restore --source=HEAD --staged --worktree -- .github/workflows
          if [ -s "$RUNNER_TEMP/conflicted.txt" ] &&
            xargs -a "$RUNNER_TEMP/conflicted.txt" -d '\n' grep -lE '^(<<<<<<<|>>>>>>>)( |$)' -- 2>/dev/null >"$RUNNER_TEMP/unresolved.txt"; then
            { echo "Conflict markers remain in:"; cat "$RUNNER_TEMP/unresolved.txt"; } | tee -a "$log"
            exit 1
          fi
          vp install 2>&1 | tail -20 | tee -a "$log" || exit 1
          ok=0
          for pkg in @t3tools/contracts @t3tools/web @t3tools/desktop; do
            vp run --filter "$pkg" typecheck 2>&1 | tail -40 | tee -a "$log" || ok=1
          done
          exit $ok
          EOF
          chmod +x "$RUNNER_TEMP/verify.sh"
      - name: Check merged code
        if: env.merged_locally == 'true'
        run: |
          "$RUNNER_TEMP/verify.sh" || echo "fix_reason=checks" >>"$GITHUB_ENV"

      # Per-release memory across runs: whether Claude already made a full attempt, and whether the
      # owner was already alerted. Lookups only; nothing is downloaded.
      - name: Look up earlier Claude attempt
        id: tried
        if: env.fix_reason != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sync-marker
          key: personal-sync-claude-tried-${{ env.latest }}
          lookup-only: true
      - name: Look up earlier alert
        id: alerted
        if: env.fix_reason != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sync-marker
          key: personal-sync-alerted-${{ env.latest }}
          lookup-only: true
      - name: Decide whether to call Claude
        if: env.fix_reason != ''
        run: |
          if [ "$HAS_CLAUDE" != true ]; then
            echo "outcome=no-token" >>"$GITHUB_ENV"
          elif [ "${{ steps.tried.outputs.cache-hit }}" = true ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "outcome=tried-before" >>"$GITHUB_ENV"
          else
            echo "call_claude=true" >>"$GITHUB_ENV"
            vp install || true
          fi

      - name: Fix with Claude
        id: claude
        if: env.call_claude == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        env:
          FIX_REASON: ${{ env.fix_reason }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Follow the instructions in .github/personal-merge-fix.md. FIX_REASON is "${{ env.fix_reason }}".
          claude_args: >-
            --max-turns 150
            --allowedTools "Bash,Read,Edit,MultiEdit,Write,Glob,Grep"
            --disallowedTools "Bash(git push:*),Bash(git commit:*),Bash(git merge:*),Bash(git reset:*),Bash(git switch:*),Bash(git config:*),Bash(git remote:*),Bash(gh:*),Bash(curl:*),Bash(wget:*)"
      - name: Check Claude's fix
        if: env.call_claude == 'true'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          if "$RUNNER_TEMP/verify.sh"; then
            echo "outcome=fixed" >>"$GITHUB_ENV"
            exit 0
          fi
          # Classify from Claude's final result message only, never from file contents it read.
          result=""
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            result=$(jq -r '[.[] | select(.type == "result")] | last | "\(.subtype // "") \(.result // "")"' "$EXECUTION_FILE" 2>/dev/null || true)
          fi
          if printf '%s' "$result" | grep -Eiq 'authentication_error|oauth token|token (has )?expired|login expired|invalid (api key|bearer|token)|\b401\b'; then
            outcome=auth
          elif printf '%s' "$result" | grep -Eiq 'usage limit|rate.?limit|hit your limit|limit reached|\b429\b|overloaded|\b529\b'; then
            outcome=limited
          elif [ "$CLAUDE_OUTCOME" = success ] || printf '%s' "$result" | grep -q 'error_max_turns'; then
            # Claude finished (or ran out of turns) and the result still fails: retrying spends the same tokens again.
            outcome=attempted
          else
            # Failed before producing a result (often a usage limit); costs nothing to retry.
            outcome=limited
          fi
          echo "outcome=$outcome" >>"$GITHUB_ENV"
          delimiter="CLAUDE_$(openssl rand -hex 16)"
          printf 'claude_result<<%s\n%s\n%s\n' "$delimiter" "${result:0:400}" "$delimiter" >>"$GITHUB_ENV"
      - name: Remember Claude's attempt
        if: env.outcome == 'attempted'
        run: echo "$latest" >"$RUNNER_TEMP/sync-marker"
      - name: Save Claude's attempt
        if: env.outcome == 'attempted'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sync-marker
          key: personal-sync-claude-tried-${{ env.latest }}

      - name: Commit fix
        if: env.outcome == 'fixed'
        run: |
          set -euo pipefail
          # The action sets its own git identity; commits stay the owner's.
          git config user.name "mattxslv"
          git config user.email "79420609+mattxslv@users.noreply.github.com"
          # A lockfile rewritten only by `vp install` on the runner is noise; keep it when the merge touched it.
          grep -qx pnpm-lock.yaml "$RUNNER_TEMP/conflicted.txt" || git checkout -- pnpm-lock.yaml
          git add -A
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit --quiet
          elif ! git diff --cached --quiet; then
            git commit --quiet -m "fix: adapt personal customizations to official $latest"
          fi
          {
            echo "## Official $latest merged by Claude"
            echo
            echo "Reason: $fix_reason"
            if [ "$fix_reason" = conflicts ]; then
              echo
              sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicted.txt"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Push merge
        id: push
        if: env.latest != '' && (env.outcome == 'fixed' || (env.merged_locally == 'true' && env.fix_reason == ''))
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only a real merge of the official release goes out.
          git merge-base --is-ancestor "$latest" HEAD
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:personal/release
          echo "merged=true" >>"$GITHUB_OUTPUT"
      - name: Report merge outcome
        id: report
        if: env.fix_reason != '' && env.outcome != 'fixed'
        env:
          GH_TOKEN: ${{ github.token }}
          ALREADY_ALERTED: ${{ steps.alerted.outputs.cache-hit }}
        run: |
          set -euo pipefail
          title="Update to official $latest needs attention"
          published=$(gh release view "$latest" --repo pingdotgg/t3code --json publishedAt -q .publishedAt)
          age=$(( $(date +%s) - $(date -d "$published" +%s) ))
          case "$outcome" in
            limited)
              status="Claude could not finish, most likely because of a usage limit. The next run (about five hours) tries again."
              alert=$([ "$age" -ge $((48 * 3600)) ] && echo true || echo false) ;;
            auth)
              status='Claude could not sign in: the token is expired or invalid. Run `claude setup-token` and replace the `CLAUDE_CODE_OAUTH_TOKEN` secret.'
              alert=true ;;
            no-token)
              status='No `CLAUDE_CODE_OAUTH_TOKEN` secret is set, so nothing tried to fix it. Run `claude setup-token` and add the secret.'
              alert=true ;;
            attempted)
              status="Claude tried but the result still fails the checks below. Claude is not called again for this release unless you run this workflow by hand."
              alert=true ;;
            tried-before)
              status="Claude already tried this release without a passing result; not calling it again. Run this workflow by hand to retry."
              alert=true ;;
            *)
              status="The automatic fix did not run as expected."
              alert=true ;;
          esac
          if [ "$fix_reason" = conflicts ]; then
            details=$(printf 'Merging official T3 Code `%s` into `personal/release` conflicts in:\n\n%s' "$latest" "$(sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicted.txt")")
          else
            details=$(printf 'Official T3 Code `%s` merged cleanly but type-checking failed.' "$latest")
          fi
          body=$(printf '%s\n\n%s Nothing was pushed.\n\nTo fix it by hand: `git merge %s`, resolve, push, and the release builds automatically.\n\n```\n%s\n```' \
            "$details" "$status" "$latest" "$(tail -60 "$RUNNER_TEMP/check.log" 2>/dev/null; [ -n "${claude_result:-}" ] && printf '\nClaude: %s' "$claude_result")")
          printf '## %s\n\n%s\n' "$title" "$body" >>"$GITHUB_STEP_SUMMARY"
          if [ "$alert" != true ]; then
            echo "::warning title=$title::Not fixed yet; retrying on the next run in about five hours."
            exit 0
          fi
          if [ "$ALREADY_ALERTED" = true ]; then
            echo "::warning title=$title::Already reported for this release. See the run summary."
            exit 0
          fi
          # Issues are disabled on this fork: the run summary carries the details and the failed run is the alert.
          if [ "$(gh repo view "$GITHUB_REPOSITORY" --json hasIssuesEnabled -q .hasIssuesEnabled)" = true ]; then
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number -q '.[0].number')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            fi
          fi
          echo "$latest" >"$RUNNER_TEMP/sync-marker"
          echo "alert=true" >>"$GITHUB_OUTPUT"
      - name: Remember the alert
        if: steps.report.outputs.alert == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sync-marker
          key: personal-sync-alerted-${{ env.latest }}
      - name: Fail to alert the owner
        if: steps.report.outputs.alert == 'true'
        run: |
          echo "::error title=Update to official $latest needs attention::See the run summary."
          exit 1
      - name: Keep inherited upstream workflows disabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow list --repo "$GITHUB_REPOSITORY" --all --json name,path,state \
            -q '.[] | select(.state == "active") | select(.path | test("/personal-") | not) | .path' \
            | while read -r path; do gh workflow disable "$(basename "$path")" --repo "$GITHUB_REPOSITORY" || true; done

  release:
    needs: sync
    if: needs.sync.outputs.merged == 'true'
    uses: ./.github/workflows/personal-release.yml
